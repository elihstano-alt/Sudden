name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Gerar APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/SuddenMobile.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SuddenMobile
          path: build/SuddenMobile.apk
